# Image Hash Memory 配置文件
# 修改后即时生效，无需重启

# 感知哈希匹配阈值（dHash 汉明距离上限：默认 24）
hamming_threshold: 24

# 是否开启 pHash（离散余弦变换）综合门禁双保险
enable_phash: true
phash_threshold: 12

# 校验模式：composite（综合门禁：dHash <= 24 且 pHash <= 12 双门禁全部满足才放行）
verification_mode: composite

# 是否开启旧图自动召回与上下文注入
enable_recall: true

# 是否在新轮次自动将新发现追加/叠加到原图记录中（以“；”间隔）
auto_append_summary: true

# 单次摘要最大提取长度（字数）
max_summary_length: 200

# SQLite 数据库持久化存储路径
db_path: "~/.hermes/data/image_memory.db"
